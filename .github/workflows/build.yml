name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Upload executable
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: redalert-linux-x86_64
          path: build/redalert

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Check that the linker makes string literals writable
        run: |
          # The game writes into some of its string literals; CMakeLists.txt has the linker put
          # them in a writable segment.
          printf '#include <stdio.h>\nint main(void) { char * p = (char *)"literal"; p[0] = 76; puts(p); return 0; }\n' > literal.c
          clang -O0 literal.c -o literal -Wl,-rename_section,__TEXT,__cstring,__DATA,__cstring
          ./literal | grep -qx Literal

      - name: Start without the game data
        run: |
          # It starts up, finds no data, says so and exits.
          set +e
          RA_NO_MESSAGEBOX=1 SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy RA_DATA_DIR="$RUNNER_TEMP/no-data" ./build/redalert > start.txt 2>&1
          status=$?
          set -e
          cat start.txt
          test $status -ne 0
          grep -q "game data files were not found" start.txt

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: redalert-macos-arm64
          path: build/redalert

  windows:
    name: Windows (MinGW-w64 cross-compile)
    runs-on: ubuntu-24.04
    permissions:
      contents: write         # To publish the pre-release (last step).
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: false
    env:
      SDL2_VERSION: 2.30.9
      SDL2_SHA256: b188d165dc4a0372042bff3d0c18e9bb90772581e92a7b8b47b521b47714f75c
      SEVENZIP_VERSION: "25.01"
      SEVENZIP_SHA256: 78afa2a1c773caf3cf7edf62f857d2a8a5da55fb0fff5da416074c0d28b2b55f
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 nsis 7zip

      - name: Get SDL2 for MinGW
        run: |
          curl -fsSL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          echo "${SDL2_SHA256}  sdl2.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdl2"
          tar -xzf sdl2.tar.gz -C "$RUNNER_TEMP/sdl2"

      # The installer can download the game data (EA's freeware release); it unpacks it with
      # 7-Zip, from 7-Zip's official 64-bit installer.
      - name: Get 7-Zip
        run: |
          curl -fsSL -o 7z-setup.exe "https://github.com/ip7z/7zip/releases/download/${SEVENZIP_VERSION}/7z${SEVENZIP_VERSION//./}-x64.exe"
          echo "${SEVENZIP_SHA256}  7z-setup.exe" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/7zip"
          7z x -y -o"$RUNNER_TEMP/7zip" 7z-setup.exe 7z.exe 7z.dll License.txt

      - name: Configure
        run: >
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl2/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32"

      - name: Build
        run: cmake --build build-win

      - name: Build the installer (without the game data, which it downloads)
        run: tools/windows/make-installer.sh --7zip "$RUNNER_TEMP/7zip" --out build-win/redalert-setup.exe build-win

      - name: Collect the program
        run: |
          mkdir -p redalert-windows
          cp build-win/redalert.exe "$RUNNER_TEMP/sdl2/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/bin/SDL2.dll" \
            "$RUNNER_TEMP/sdl2/SDL2-${SDL2_VERSION}/README-SDL.txt" README.md LICENSE.md redalert-windows/
          x86_64-w64-mingw32-strip redalert-windows/redalert.exe

      - name: Upload the program
        uses: actions/upload-artifact@v4
        with:
          name: redalert-windows-x86_64
          path: redalert-windows

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: redalert-windows-installer
          path: build-win/redalert-setup.exe

      # The latest build of these branches, as a pre-release on the Releases page (tag
      # windows-BRANCH, replaced each time): the installer and the program. Never the game
      # data: EA's license doesn't allow distributing it.
      - name: Publish the pre-release
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref_name == 'main' || github.ref_name == 'ccr-bd99920f-e9tsoh')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: windows-${{ github.ref_name }}
        run: |
          cp build-win/redalert-setup.exe redalert-windows-setup.exe
          (cd redalert-windows && zip -9 -r ../redalert-windows-x86_64.zip .)
          sed -e "s|@BRANCH@|${GITHUB_REF_NAME}|g" -e "s|@COMMIT@|${GITHUB_SHA::7}|g" \
            -e "s|@REPO@|${GITHUB_REPOSITORY}|g" tools/windows/release-notes.md > release-notes.md
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Red Alert for Windows (latest build of ${GITHUB_REF_NAME})" \
            --notes-file release-notes.md \
            redalert-windows-setup.exe redalert-windows-x86_64.zip
