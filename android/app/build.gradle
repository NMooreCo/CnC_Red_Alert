/*
**	The app: SDL2's Java side (from SDL's source), this app's two activities, and the game
**	built by the repository's CMakeLists.txt as libredalert.so (with SDL2 as libSDL2.so).
*/
plugins {
    id 'com.android.application'
}

/*
**	SDL2's source: downloaded from SDL's releases the first time (and checked), or given with
**	-Psdl2Dir=/path/to/SDL2-2.32.10.
*/
def sdlVersion = '2.32.10'
def sdlSha256 = '5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165'
def sdlDir = project.hasProperty('sdl2Dir') ? file(project.property('sdl2Dir')) : file("${rootDir}/build/SDL2-${sdlVersion}")
if (!new File(sdlDir, 'android-project').exists()) {
    def archive = file("${rootDir}/build/SDL2-${sdlVersion}.tar.gz")
    archive.parentFile.mkdirs()
    if (!archive.exists()) {
        logger.lifecycle("Downloading SDL ${sdlVersion}...")
        new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL2-${sdlVersion}.tar.gz")
            .withInputStream { input -> archive.withOutputStream { it << input } }
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
    if (digest != sdlSha256) {
        archive.delete()
        throw new GradleException("SDL ${sdlVersion}: the download's SHA-256 is ${digest}, not ${sdlSha256}")
    }
    copy {
        from tarTree(resources.gzip(archive))
        into "${rootDir}/build"
    }
}

android {
    namespace 'io.github.nmooreco.redalert'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.nmooreco.redalert'
        minSdk 30				// Android 11: the game's library has a read only data segment (see CMakeLists.txt).
        targetSdk 35
        versionCode project.hasProperty('raVersionCode') ? project.property('raVersionCode').toInteger() : 1
        versionName project.hasProperty('raVersionName') ? project.property('raVersionName') : 'dev'
        externalNativeBuild {
            cmake {
                arguments "-DSDL2_SOURCE_DIR=${sdlDir}",
                          '-DANDROID_STL=c++_shared',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'	// Phones with 16 KB memory pages.
                targets 'redalert', 'SDL2'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    /*
    **	One signing key for every build (debug.keystore, not a secret), so that a newer build
    **	installs over an older one.
    */
    signingConfigs {
        shared {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
